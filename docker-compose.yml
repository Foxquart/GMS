version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gms-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-gms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gms_password}
      POSTGRES_DB: ${DB_NAME:-gms_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-gms_user} -d ${DB_NAME:-gms_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
